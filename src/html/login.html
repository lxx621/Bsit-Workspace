<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - Ele Admin Plus</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, Roboto, Arial, Helvetica, "Segoe UI", "Noto Sans", sans-serif;
  background: #f7f7f9 url('https://plus.eleadmin.com/assets/login-bg-BkIjQ0FB.png') no-repeat 0 0 / 100% 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  color: rgba(0,0,0,.88);
  font-size: 14px;
}
.login-main {
  flex: 1; display: flex; justify-content: center; align-items: center;
}
.login-container {
  display: flex;
  width: 920px;
  height: 462px;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 6px 16px rgba(0,0,0,.08), 0 3px 6px -4px rgba(0,0,0,.12), 0 9px 28px 8px rgba(0,0,0,.05);
  overflow: hidden;
}
.login-left {
  width: 520px;
  flex-shrink: 0;
  background: #1681fd url('https://plus.eleadmin.com/assets/login-img-BQ7KMz7P.png') no-repeat 50% 100% / contain;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 8px;
  color: #fff;
}
.login-left h1 {
  font-size: 28px;
  font-weight: 400;
  margin-bottom: 6px;
  letter-spacing: 0;
  color: rgba(255,255,255,.98);
}
.login-left h4 {
  font-size: 16px;
  font-weight: 400;
  color: rgba(255,255,255,.8);
  text-align: center;
  line-height: 1.6;
  margin: 0;
}
.login-left .logo-icon {
  display: none;
}
.login-right {
  flex: 1;
  padding: 32px 48px 0;
  display: flex;
  flex-direction: column;
}
.login-right .title {
  font-size: 24px;
  font-weight: 500;
  color: rgba(0,0,0,.92);
  margin-bottom: 18px;
}
.login-tabs {
  display: inline-flex;
  background: #f5f5f5;
  border-radius: 4px;
  padding: 3px;
  margin-bottom: 18px;
  position: relative;
}
.login-tabs .tab {
  padding: 4px 12px;
  cursor: pointer;
  font-size: 14px;
  color: rgba(0,0,0,.65);
  border-radius: 4px;
  transition: all .3s;
  position: relative;
  z-index: 1;
  user-select: none;
}
.login-tabs .tab.active {
  color: rgba(0,0,0,.92);
  background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
  font-weight: 400;
}
/* 扫码登录面板 */
.qr-panel {
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 24px 0;
}
.qr-panel.show { display: flex; }
.qr-panel .qr-code {
  width: 180px; height: 180px;
  background: #fff;
  border: 1px solid #eee;
  display: flex; align-items: center; justify-content: center;
  border-radius: 4px;
}
.qr-panel .qr-code svg { width: 160px; height: 160px; }
.qr-panel .qr-refresh {
  margin-top: 12px;
  color: #2f54eb;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
}
.qr-panel .qr-refresh:hover { opacity: .8; }
.qr-panel .qr-refresh svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 4; }
.form-group {
  margin-bottom: 20px;
  position: relative;
}
.form-group input {
  width: 100%;
  height: 40px;
  padding: 0 12px;
  border: 1px solid #d9d9d9;
  border-radius: 6px;
  font-size: 14px;
  outline: none;
  transition: border-color .2s;
  color: rgba(0,0,0,.88);
}
.form-group input:focus {
  border-color: #2f54eb;
  box-shadow: 0 0 0 2px rgba(47,84,235,.1);
}
.form-group input::placeholder {
  color: rgba(0,0,0,.36);
}
.captcha-row {
  display: flex;
  gap: 12px;
}
.captcha-row input {
  flex: 1;
}
.captcha-row .captcha-img {
  width: 120px;
  height: 40px;
  border-radius: 6px;
  background: #f5f5f5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: bold;
  color: #2f54eb;
  letter-spacing: 4px;
  cursor: pointer;
  user-select: none;
  border: 1px solid #e8e8e8;
}
.remember-row {
  display: flex;
  align-items: center;
  margin-bottom: 24px;
  font-size: 14px;
}
.remember-row input[type="checkbox"] {
  width: 16px;
  height: 16px;
  margin-right: 8px;
  accent-color: #2f54eb;
}
.login-btn {
  width: 100%;
  height: 40px;
  background: #2f54eb;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 400;
  cursor: pointer;
  transition: background .3s;
  letter-spacing: 0;
}
.login-btn:hover {
  background: #1d39c4;
}
.login-footer {
  text-align: center;
  padding: 16px 0;
  color: rgba(0,0,0,.36);
  font-size: 14px;
}
.login-footer a {
  color: rgba(0,0,0,.5);
  text-decoration: none;
  margin: 0 12px;
}
.login-footer a:hover {
  color: #2f54eb;
}
</style>
</head>
<body>
<div class="login-main">
<div class="login-container">
  <div class="login-left">
    <div class="logo-icon">
      <svg viewBox="0 0 40 40" fill="none" width="48" height="48">
        <circle cx="20" cy="20" r="18" fill="url(#loginLogoGrad)"/>
        <path d="M13 11h5v18h-5z M20 11h5v8h-5z M20 21h7v8h-7z" fill="#fff" opacity="0.9"/>
        <defs><linearGradient id="loginLogoGrad" x1="0" y1="0" x2="40" y2="40"><stop offset="0%" stop-color="#4e8ef7"/><stop offset="100%" stop-color="#f46b45"/></linearGradient></defs>
      </svg>
    </div>
    <h1>Ele Admin Plus</h1>
    <h4>界面美观组件丰富的中后台前端解决方案</h4>
  </div>
  <div class="login-right">
    <div class="title">用户登录</div>
    <div class="login-tabs">
      <div class="tab active">密码登录</div>
      <div class="tab">扫码登录</div>
    </div>
    <form id="loginForm" class="login-panel">
      <div class="form-group">
        <input type="text" id="username" placeholder="请输入登录账号" value="admin">
      </div>
      <div class="form-group">
        <input type="password" id="password" placeholder="请输入登录密码" value="admin">
      </div>
      <div class="form-group captcha-row">
        <input type="text" id="captcha" placeholder="请输入验证码" value="sbnm6">
        <div class="captcha-img" id="captchaImg" title="点击刷新">sbnm6</div>
      </div>
      <div class="remember-row">
        <input type="checkbox" id="remember" checked>
        <label for="remember">记住密码</label>
      </div>
      <button type="button" class="login-btn" onclick="doLogin()">登 录</button>
    </form>
    <div class="qr-panel" id="qrPanel">
      <div class="qr-code">
        <svg viewBox="0 0 180 180" id="qrSvg"></svg>
      </div>
      <div class="qr-refresh" onclick="refreshQR()">
        <svg viewBox="0 0 48 48" stroke-linecap="round" stroke-linejoin="round"><path d="M42 8v12H30"/><path d="M6 24a18 18 0 0130.7-12.7L42 17"/><path d="M6 40V28h12"/><path d="M42 24a18 18 0 01-30.7 12.7L6 31"/></svg>
        刷新二维码
      </div>
    </div>
  </div>
</div>
</div>
<div class="login-footer">
  <a href="#">官网</a>
  <a href="#">文档</a>
  <a href="#">授权</a>
  <br>
  <span style="margin-top:8px;display:inline-block;">Copyright © 2025 武汉易云智科技有限公司</span>
</div>
<script>
/* 登录按钮点击 → 跳转后台首页 */
function doLogin() {
  window.location.href = 'index.html';
}
/* 切换登录Tab - 密码登录/扫码登录 */
document.querySelectorAll('.login-tabs .tab').forEach((tab, idx) => {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.login-tabs .tab').forEach(t => t.classList.remove('active'));
    this.classList.add('active');
    const form = document.getElementById('loginForm');
    const qr = document.getElementById('qrPanel');
    if (idx === 0) {
      form.style.display = ''; qr.classList.remove('show');
    } else {
      form.style.display = 'none'; qr.classList.add('show');
    }
  });
});
/* 生成简易二维码SVG */
function refreshQR() {
  const svg = document.getElementById('qrSvg');
  const size = 180; const cells = 37; const cs = size / cells;
  let paths = `<rect width="${size}" height="${size}" fill="#fff"/>`;
  for (let y = 0; y < cells; y++) {
    for (let x = 0; x < cells; x++) {
      if (isQRModule(x, y, cells)) {
        paths += `<rect x="${x*cs}" y="${y*cs}" width="${cs+.5}" height="${cs+.5}" fill="#000"/>`;
      }
    }
  }
  svg.innerHTML = paths;
}
function isQRModule(x, y, n) {
  /* 定位图案 - 左上/右上/左下 */
  if ((x < 8 && y < 8) || (x >= n-8 && y < 8) || (x < 8 && y >= n-8)) {
    const cx = x < 8 ? x : (x >= n-8 ? x-(n-7) : x);
    const cy = y < 8 ? y : y-(n-7);
    if (cx===0||cx===6||cy===0||cy===6) return true;
    if (cx>=2&&cx<=4&&cy>=2&&cy<=4) return true;
    return false;
  }
  /* 定时图案 */
  if (y === 6 || x === 6) return (x+y) % 2 === 0;
  /* 随机数据区 */
  return Math.random() > 0.5;
}
refreshQR();
/* 刷新验证码 */
document.getElementById('captchaImg').addEventListener('click', function() {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let code = '';
  for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
  this.textContent = code;
  document.getElementById('captcha').value = code;
});
</script>
</body>
</html>
